name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Gradle e Limpar Configurações
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        
        # Limpar settings.gradle de forma limpa
        python3 -c "
        import glob
        for path in glob.glob('**/settings.gradle*', recursive=True):
            with open(path, 'w', encoding='utf-8') as f:
                f.write(\"include ':app'\n\")
        "

    - name: Compilar APK Diretamente com o Gradle
      run: gradle assembleDebug --stacktrace

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
