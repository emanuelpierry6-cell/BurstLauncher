name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle Oficial (8.5)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Gerar Projeto Android Completo com Python
      run: |
        python3 -c "
        import os

        # 1. settings.gradle
        with open('settings.gradle', 'w', encoding='utf-8') as f:
            f.write('''pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = 'BurstLauncher'
            include ':app'
            ''')

        # 2. root build.gradle
        with open('build.gradle', 'w', encoding='utf-8') as f:
            f.write('// Root build file\n')

        # 3. app/build.gradle
        os.makedirs('app', exist_ok=True)
        with open('app/build.gradle', 'w', encoding='utf-8') as f:
            f.write('''plugins {
                id 'com.android.application'
            }

            android {
                namespace 'com.burst.launcher'
                compileSdk 34

                defaultConfig {
                    applicationId 'com.burst.launcher'
                    minSdk 24
                    targetSdk 34
                    versionCode 1
                    versionName '1.0'
                    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
                }

                buildTypes {
                    release {
                        minifyEnabled false
                        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                    }
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }

            dependencies {
                implementation 'androidx.core:core-ktx:1.12.0'
                implementation 'androidx.appcompat:appcompat:1.6.1'
                implementation 'com.google.android.material:material:1.11.0'
            }
            ''')

        # 4. AndroidManifest.xml
        manifest_dir = 'app/src/main'
        os.makedirs(manifest_dir, exist_ok=True)
        with open(os.path.join(manifest_dir, 'AndroidManifest.xml'), 'w', encoding='utf-8') as f:
            f.write('''<?xml version=\"1.0\" encoding=\"utf-8\"?>
            <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
                <application
                    android:allowBackup=\"true\"
                    android:supportsRtl=\"true\"
                    android:theme=\"@style/Theme.AppCompat.Light.DarkActionBar\">
                    <activity
                        android:name=\".MainActivity\"
                        android:exported=\"true\">
                        <intent-filter>
                            <action android:name=\"android.intent.action.MAIN\" />
                            <category android:name=\"android.intent.category.LAUNCHER\" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            ''')

        # 5. MainActivity.java
        java_dir = 'app/src/main/java/com/burst/launcher'
        os.makedirs(java_dir, exist_ok=True)
        with open(os.path.join(java_dir, 'MainActivity.java'), 'w', encoding='utf-8') as f:
            f.write('''package com.burst.launcher;

            import android.os.Bundle;
            import androidx.appcompat.app.AppCompatActivity;

            public class MainActivity extends AppCompatActivity {
                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    android.widget.TextView tv = new android.widget.TextView(this);
                    tv.setText(\"Burst Launcher Ativo!\");
                    setContentView(tv);
                }
            }
            ''')

        print('Estrutura completa gerada com sucesso!')
        "

    - name: Compilar APK Final
      run: gradle assembleDebug --stacktrace

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
