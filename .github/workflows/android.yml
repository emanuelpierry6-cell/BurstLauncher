name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle Estável (8.5)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Ajustes Automáticos (Repositórios e Namespace)
      run: |
        python3 -c "
        import glob
        # 1. Corrigir repositórios
        for path in glob.glob('**/settings.gradle*', recursive=True):
            with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            if 'FAIL_ON_PROJECT_REPOS' in content:
                content = content.replace('FAIL_ON_PROJECT_REPOS', 'PREFER_PROJECT')
                with open(path, 'w', encoding='utf-8') as f:
                    f.write(content)

        # 2. Injetar namespace no app/build.gradle
        for path in glob.glob('**/app/build.gradle', recursive=True):
            with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            if 'namespace' not in content:
                content = content.replace('android {', 'android {\n    namespace \"com.mojang.minecraftpe\"')
                with open(path, 'w', encoding='utf-8') as f:
                    f.write(content)
        "

    - name: Compilar APK
      run: gradle assembleDebug

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
