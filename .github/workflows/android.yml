name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle Oficial (8.5)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Ajustar Configurações e Plugin com Python
      run: |
        python3 -c "
        import glob, re

        # 1. Reescrever settings.gradle otimizado para Gradle 8.5
        settings_content = '''pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        include ':app'
        '''
        for path in glob.glob('**/settings.gradle*', recursive=True):
            with open(path, 'w', encoding='utf-8') as f:
                f.write(settings_content)
            print(f'Settings atualizado em: {path}')

        # 2. Atualizar o Plugin do Android para a versão 8.1.1 (compatível com Gradle 8.5)
        for path in glob.glob('**/build.gradle*', recursive=True):
            with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            content = re.sub(r'com\.android\.tools\.build:gradle:[\'\"].*?[\'\"]', \"com.android.tools.build:gradle: '8.1.1'\", content)
            with open(path, 'w', encoding='utf-8') as f:
                f.write(content)
            print(f'Build.gradle atualizado em: {path}')
        "

    - name: Compilar APK com Gradle 8.5
      run: gradle assembleDebug --stacktrace

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
