name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Gradle no sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

    - name: Gerar Gradle Wrapper
      run: gradle wrapper --gradle-version 8.0

    - name: Dar permissão ao gradlew
      run: chmod +x gradlew

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Compilar APK
      run: ./gradlew assembleDebug

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
