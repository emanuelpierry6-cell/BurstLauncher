name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Reescrever settings.gradle limpo com Python
      run: |
        python3 -c "
        import glob
        for path in glob.glob('**/settings.gradle*', recursive=True):
            with open(path, 'w', encoding='utf-8') as f:
                f.write(\"include ':app'\n\")
            print(f'Ficheiro reescrito com sucesso: {path}')
        "

    - name: Criar Wrapper e Compilar
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper --gradle-version 7.5
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
