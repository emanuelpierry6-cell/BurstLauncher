name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle Oficial
      uses: gradle/actions/setup-gradle@v3

    - name: Corrigir conflito de repositórios com Python
      run: |
        python3 -c "
        import glob
        for path in glob.glob('**/settings.gradle*', recursive=True):
            with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            if 'FAIL_ON_PROJECT_REPOS' in content:
                content = content.replace('FAIL_ON_PROJECT_REPOS', 'PREFER_PROJECT')
                with open(path, 'w', encoding='utf-8') as f:
                    f.write(content)
                print(f'Corrigido com sucesso em: {path}')
        "

    - name: Compilar APK com Informação Detalhada
      run: gradle assembleDebug --info

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
