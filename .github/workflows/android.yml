name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle Oficial (8.5)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Remover Conflitos de Repositórios com Python
      run: |
        python3 -c "
        import glob
        
        # Reescrever settings.gradle sem restrições estritas de repositórios
        settings_content = '''pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        include ':app'
        '''
        for path in glob.glob('**/settings.gradle*', recursive=True):
            with open(path, 'w', encoding='utf-8') as f:
                f.write(settings_content)
            print(f'Settings limpo com sucesso em: {path}')
        "

    - name: Compilar APK com Gradle 8.5
      run: gradle assembleDebug --stacktrace

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
