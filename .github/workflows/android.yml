name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle Oficial (7.5)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.5'

    - name: Limpar e Corrigir Ficheiros de Configuração
      run: |
        python3 -c "
        import glob, re

        # Limpar settings.gradle
        for path in glob.glob('**/settings.gradle*', recursive=True):
            with open(path, 'w', encoding='utf-8') as f:
                f.write(\"include ':app'\n\")
            print(f'Settings limpo: {path}')

        # Remover blocos problemáticos nos build.gradle que causam conflitos de sintaxe
        for path in glob.glob('**/build.gradle*', recursive=True):
            with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            # Remove linhas duplicadas ou problemáticas de repositoriesMode se existirem
            content = re.sub(r'dependencyResolutionManagement\s*\{[^}]*\}', '', content, flags=re.DOTALL)
            with open(path, 'w', encoding='utf-8') as f:
                f.write(content)
            print(f'Build.gradle corrigido: {path}')
        "

    - name: Compilar APK
      run: gradle assembleDebug --stacktrace

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
