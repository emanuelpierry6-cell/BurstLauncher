name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Instalar Gradle no Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

    - name: Limpar restrições do Gradle com Python
      run: |
        python3 -c "
        import glob
        for path in glob.glob('**/settings.gradle*', recursive=True):
            with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                lines = f.readlines()
            new_lines = [l for l in lines if 'repositoriesMode' not in l and 'FAIL_ON_PROJECT_REPOS' not in l]
            with open(path, 'w', encoding='utf-8') as f:
                f.writelines(new_lines)
        "

    - name: Compilar com Gradle do Sistema
      run: gradle assembleDebug --stacktrace

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
