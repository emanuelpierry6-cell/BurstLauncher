name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle Oficial (8.5)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Modernizar Estrutura do Projeto com Python
      run: |
        python3 -c "
        import os

        # 1. settings.gradle moderno
        settings_content = '''pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = 'BurstLauncher'
        include ':app'
        '''
        with open('settings.gradle', 'w', encoding='utf-8') as f:
            f.write(settings_content)

        # 2. root build.gradle limpo
        with open('build.gradle', 'w', encoding='utf-8') as f:
            f.write('// Root build file modernizado\n')

        # 3. app/build.gradle moderno sem buildscript antigo
        app_build_dir = 'app'
        os.makedirs(app_build_dir, exist_ok=True)
        app_build_content = '''plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.burst.launcher'
            compileSdk 34

            defaultConfig {
                applicationId 'com.burst.launcher'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'

                testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        '''
        with open(os.path.join(app_build_dir, 'build.gradle'), 'w', encoding='utf-8') as f:
            f.write(app_build_content)

        print('Projeto modernizado com sucesso!')
        "

    - name: Compilar APK Definitivo
      run: gradle assembleDebug --stacktrace

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
