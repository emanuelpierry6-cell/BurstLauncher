name: Build Burst Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle Oficial (8.5)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Limpar e Blindar Configurações com Python
      run: |
        python3 -c "
        # 1. Criar um settings.gradle limpo
        settings_content = '''pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        include ':app'
        '''
        with open('settings.gradle', 'w', encoding='utf-8') as f:
            f.write(settings_content)

        # 2. Substituir o build.gradle principal da raiz por um modelo infalível
        root_build_gradle = '''buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        '''
        with open('build.gradle', 'w', encoding='utf-8') as f:
            f.write(root_build_gradle)
        print('Ficheiros da raiz corrigidos com sucesso!')
        "

    - name: Compilar APK Definitivo
      run: gradle assembleDebug --stacktrace

    - name: Enviar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Burst-Launcher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
